<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1976d2">
<title>ToTo Tools</title>
<meta property="og:title" content="ToTo Tools">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-title" content="ToTo Tools">
<meta name="description" content="Calidad  en cada herramienta y artículo">
<meta property="og:description" content="Calidad  en cada herramienta y artículo">


<style>
:root{--c:#0a7c86;--on:#fff;--bg:#f3f6f6;--card:#fff;--ink:#14212b;--mut:#62727d;--line:#e2e9ec;--soft:#e6f3f4;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1519;--card:#162027;--ink:#e8eff2;--mut:#93a4ae;--line:#25343d;--soft:#1b2b31}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block}
.wrap{max-width:1100px;margin:0 auto}
/* cabecera */
.cover{height:150px;background:linear-gradient(135deg,var(--c),var(--c2,#0b3a40));background-size:cover;background-position:center;position:relative}
.cover img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}.cover img.err{display:none}.cover:after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,rgba(0,0,0,.18))}
.hd{padding:0 16px 14px;margin-top:-38px;position:relative;z-index:1}
.logo{width:76px;height:76px;border-radius:20px;border:4px solid var(--bg);background:var(--c);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.hd h1{margin:10px 0 2px;font-size:22px;line-height:1.2}
.hd .fr{color:var(--mut);margin:0 0 8px}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--ink);margin:0 6px 6px 0}
.chip.ok{background:#dcfce7;color:#166534}.chip.no{background:#fee2e2;color:#991b1b}.chip.warn{background:#fef3c7;color:#92400e}
@media (prefers-color-scheme:dark){.chip.ok{background:#123a22;color:#86efac}.chip.no{background:#3d1515;color:#fca5a5}.chip.warn{background:#3b2a0b;color:#fcd34d}}
.acts{display:flex;flex-wrap:wrap;margin:4px -4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:14px;font-weight:700;background:var(--card);border:1px solid var(--line);margin:4px}
.btn.pri{background:var(--c);color:var(--on);border-color:transparent}
.btn.wa{background:#25d366;color:#05301a;border-color:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5}
.banner{padding:10px 16px;font-size:13.5px;text-align:center}
.banner.warn{background:#fef3c7;color:#78350f}.banner.bad{background:#fee2e2;color:#991b1b}.banner.info{background:var(--soft)}
.banner a{font-weight:800;text-decoration:underline;color:inherit}
/* barra de búsqueda */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px 6px;border-bottom:1px solid var(--line)}
.sr{display:flex;align-items:center}
.sr input{flex:1;min-width:0;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 16px;outline:none}
.sr input:focus{border-color:var(--c)}
.sr select{height:44px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 10px;margin-left:8px;max-width:130px}
.chips{display:flex;overflow-x:auto;padding:8px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);margin-right:8px;font-weight:600;font-size:14px;white-space:nowrap}
.cat.on{background:var(--c);color:var(--on);border-color:transparent}
/* cuadrícula */
.sec{padding:14px 16px 0}
.sec h2{font-size:17px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;cursor:pointer}
.card.ag .ph img{opacity:.45}
.ph{position:relative;width:100%;padding-top:100%;background:var(--soft);overflow:hidden}
.ph:before{content:attr(data-i);position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:800;font-size:30px;color:var(--c);opacity:.35}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;background:var(--soft)}
.ph img.err{display:none}
.bdg{position:absolute;left:8px;top:8px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;background:#e11d48;color:#fff}
.bdg.ag{background:#475569}
.bdg.de{background:#f59e0b;color:#3b2300;top:auto;bottom:8px}
.fav{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);color:#94a3b8;font-size:18px;line-height:36px;text-align:center}
.fav.on{color:#e11d48}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.cb h3{margin:0 0 4px;font-size:14.5px;line-height:1.3;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:800;font-size:15px}
.pr s{font-weight:500;color:var(--mut);font-size:12.5px;margin-left:4px}
.pr small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
.add{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:12px;background:var(--c);color:var(--on);font-size:22px;font-weight:700;line-height:38px;text-align:center}
.hs{display:flex;overflow-x:auto;padding:0 16px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .card{flex:0 0 150px;margin-right:10px;scroll-snap-align:start}
.hs{scroll-snap-type:x proximity;scroll-padding-left:16px}
.sec.shd{display:flex;align-items:baseline;justify-content:space-between}
.tk{overflow:hidden;background:var(--c);color:var(--on);font-weight:700;font-size:13px;padding:7px 0;white-space:nowrap}
.tk .tr{display:inline-block;animation:tk 20s linear infinite}
.tk .tr span{display:inline-block;padding-right:2.5em}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.inst{display:flex;align-items:center;gap:10px;background:var(--soft);border-bottom:1px solid var(--line);padding:10px 14px;font-size:13px}
.inst .sp{flex:1}
.dests{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.dst{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--tx,inherit);background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.dst .rd{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--mut);box-sizing:border-box}
.dst.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--soft))}
.dst.on .rd{border-color:var(--c);background:radial-gradient(var(--c) 0 45%,transparent 50%)}
.dst .tx{display:flex;flex-direction:column;line-height:1.25}.dst .tx span{color:var(--mut);font-size:13px}
.sec .dz{font:inherit;font-size:13px;font-weight:800;background:var(--c);color:var(--on);border:0;border-radius:99px;padding:6px 14px;white-space:nowrap;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);display:inline-flex;align-items:center;gap:6px}
.sec .dz .ar{display:inline-block;font-size:17px;line-height:1;animation:dzp 1.1s ease-in-out infinite}
@keyframes dzp{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.more{display:block;margin:18px auto;min-width:180px}
.empty{padding:50px 24px;text-align:center;color:var(--mut)}
.foot{padding:26px 16px 110px;text-align:center;color:var(--mut);font-size:12.5px}
/* barra del pedido */
#cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));pointer-events:none;display:none}
#cartbar.on{display:block}
#cartbar button{pointer-events:auto;width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:54px;border-radius:16px;background:var(--c);color:var(--on);font-weight:800;padding:0 18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* hojas */
#ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
body.sh-lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
#ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;border-radius:22px 22px 0 0;position:relative;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){#ov{align-items:center}.sheet{border-radius:22px;max-height:90vh;max-height:90dvh}}
.sh-x{position:absolute;right:10px;top:10px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);color:#222;font-size:20px;line-height:38px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--soft)}
.gal::-webkit-scrollbar{display:none}
.gal .ph{flex:0 0 100%;scroll-snap-align:center;padding-top:108%}
.gal .ph img{object-fit:contain;background:#fff}
.pr small.tr{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-top:2px}
.dots{text-align:center;margin-top:-18px;position:relative;height:14px}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;opacity:.55;margin:0 3px;box-shadow:0 0 2px rgba(0,0,0,.4)}
.dots i.on{opacity:1}
.thumbs{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs .th{flex:0 0 60px;height:60px;padding:0;border-radius:11px;overflow:hidden;border:2px solid transparent;opacity:.65;background:var(--soft)}
.thumbs .th.on{border-color:var(--c);opacity:1}
.thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
.tl-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl-r{display:flex;gap:10px;margin:12px 0 8px}
.tl-r div{flex:1;background:var(--soft);border-radius:12px;padding:12px;text-align:center}
.tl-r small{display:block;font-size:11px;text-transform:uppercase;color:var(--mut)}
.tl-r b{display:block;font-size:20px;margin:3px 0}
.tl-av{font-size:12.5px;color:var(--warn);background:rgba(180,83,9,.08);padding:8px 10px;border-radius:9px;margin-top:8px}
.sb{padding:16px}
.sb h2{margin:0 0 6px;font-size:20px;line-height:1.25}
.sb .pr{font-size:20px}
.desc{color:var(--mut);white-space:pre-line;margin:10px 0}
.opts{display:flex;flex-wrap:wrap;margin:4px -4px 8px}
.opt{margin:4px;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.opt.on{border-color:var(--c);background:var(--soft)}
.opt.ag{opacity:.45;text-decoration:line-through}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.qty button{width:40px;height:40px;font-size:20px;font-weight:700}
.qty b{min-width:30px;text-align:center}.qty input.qi{width:52px;height:40px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;background:transparent;text-align:center;font-weight:700;font-size:16px;padding:0;outline:0;-moz-appearance:textfield}.qty input.qi:focus{background:var(--soft)}
.lbl{display:block;font-weight:700;font-size:13px;color:var(--mut);margin:12px 0 5px}
.in{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;outline:none}
textarea.in{height:70px;padding:10px 12px;resize:none}
.in:focus{border-color:var(--c)}
.ln{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ln .ph{width:56px;padding-top:56px;flex:0 0 56px;border-radius:10px;margin-right:12px}
.ln .t{flex:1;min-width:0}
.ln .t b{display:block;font-size:14px;line-height:1.3}
.ln .t span{color:var(--mut);font-size:13px}
.tot{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:15px}.tot span:last-child{text-align:right}
.tot.g{font-size:18px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.rowh{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.rowh.hoy{font-weight:800;color:var(--c)}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14212b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;display:none;max-width:90%;text-align:center}
.load{padding:80px 20px;text-align:center;color:var(--mut)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--c);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

.pgc{margin:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pgc p{margin:0 0 12px;color:var(--mut);font-size:15px;line-height:1.45}
.pgc h4{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.pgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.pgo{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border:2px solid var(--line);border-radius:14px;background:var(--bg);font-weight:800;font-size:15px;text-align:center;color:var(--ink)}
.pgo small{font-weight:500;color:var(--mut);font-size:12.5px}
.pgo i{font-style:normal;font-size:26px;line-height:1.2}
.pgo.on{border-color:var(--c);background:var(--soft)}
.pgo.on:after{content:'✓';position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--c);color:var(--on);font-size:12px;line-height:20px}
.cstep{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding:3px;border-radius:14px;background:var(--soft);border:2px solid var(--soft)}
.cstep button{width:42px;height:38px;border-radius:11px;background:var(--card);font-size:20px;font-weight:800;color:var(--ink)}
.cstep b{font-size:17px}
.cb .pr{margin-bottom:8px}
.bdg.qd{top:auto;bottom:8px;left:auto;right:8px;background:#b45309}
#ob{position:fixed;left:0;top:0;right:0;bottom:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto}
.obc{width:100%;max-width:440px;text-align:center}
.obc .lg{width:88px;height:88px;border-radius:22px;margin:0 auto 14px;overflow:hidden;background:var(--soft);position:relative}
.obc .lg img{width:100%;height:100%;object-fit:cover;display:block}
.obc h1{font-size:25px;margin:0 0 8px;line-height:1.2}
.obc p{color:var(--mut);line-height:1.5;margin:6px 0}
.obdots{display:flex;gap:6px;justify-content:center;margin:0 0 20px}
.obdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.obdots i.on{background:var(--c);width:24px}
.obl{text-align:left;margin:16px 0;padding:0;list-style:none}
.obl li{display:flex;gap:12px;align-items:flex-start;margin:14px 0;line-height:1.45}
.obl .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--on);display:grid;place-items:center;font-size:14px;font-weight:800}
.obp{background:var(--soft);border-radius:16px;padding:18px;margin:14px 0;font-size:17px;line-height:1.5;font-weight:600}

#ob{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;min-height:100%;background:linear-gradient(160deg,var(--c),var(--c2,#0b3a40))}
.obh{flex:0 0 auto;min-height:32vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px 56px;color:#fff;text-align:center;position:relative}
.obh:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(255,255,255,.2),transparent 60%);pointer-events:none}
.obh .lg{width:104px;height:104px;border-radius:30px;margin:0 0 16px;background:rgba(255,255,255,.2);border:3px solid #fff;box-shadow:0 16px 40px rgba(0,0,0,.3),0 0 0 10px rgba(255,255,255,.1);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:36px;color:#fff;animation:obpop .55s cubic-bezier(.2,.9,.2,1) both;position:relative;z-index:1}
.obh .lg img{width:100%;height:100%;object-fit:cover;display:block}
.obh b{font-size:24px;letter-spacing:.2px;font-weight:800;position:relative;z-index:1}
.obh span{opacity:.92;font-size:15px;margin-top:8px;max-width:300px;line-height:1.4;position:relative;z-index:1}
.obp2{flex:1 0 auto;background:var(--bg);border-radius:36px 36px 0 0;margin-top:-36px;padding:32px 24px calc(32px + env(safe-area-inset-bottom));display:flex;justify-content:center;box-shadow:0 -16px 48px rgba(0,0,0,.18);position:relative;z-index:2}
.obc{max-width:440px;width:100%;animation:obin .4s cubic-bezier(.2,.9,.2,1) both}
.obdots{display:flex;justify-content:center;gap:8px;margin:0 0 20px}
.obdots i{width:8px;height:8px;border-radius:99px;background:var(--line);display:block;transition:width .25s ease,background .25s ease}
.obdots i.on{width:28px;background:var(--c)}
.obst{font-size:11.5px;color:var(--mut);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px;text-align:center}
.obic{width:76px;height:76px;border-radius:24px;background:var(--soft);display:grid;place-items:center;font-size:36px;margin:0 auto 16px;box-shadow:0 8px 20px rgba(0,0,0,.08);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){.obic{background:var(--soft);box-shadow:0 8px 20px rgba(0,0,0,.25)}}
.obc h1{font-size:28px;line-height:1.15;letter-spacing:-.03em;margin:0 0 10px;text-align:center;font-weight:800}
.obc>p{text-align:center;color:var(--mut);font-size:15.5px;line-height:1.5;margin:0 auto 6px;max-width:320px}
.obc .btn.pri{min-height:56px;font-size:17px;font-weight:800;border-radius:18px;background:var(--c);box-shadow:0 8px 22px rgba(0,0,0,.18);letter-spacing:.01em;color:#fff;border:0}
.obc .btn.pri:active{transform:scale(.98)}
.obb{display:block;margin:16px auto 0;color:var(--mut);font-weight:700;font-size:14px;padding:10px 16px}
.obl li{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.obl .n{font-size:18px;background:var(--soft);color:var(--c);width:42px;height:42px;border-radius:14px;font-weight:800}
@media (prefers-color-scheme:dark){.obl .n{background:var(--soft);color:var(--c)}}
.obp{background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid var(--line);font-size:17px;border-radius:18px}
#ob .pgo{padding:16px 6px;font-size:16px;border-radius:18px}
#ob .pgo i{font-size:32px}
#ob .in{height:56px;font-size:18px;border:2px solid var(--line);border-radius:16px;background:var(--card);text-align:center;font-weight:600;box-shadow:none}
#ob .in:focus{border-color:var(--c);box-shadow:0 0 0 4px rgba(0,0,0,.12);outline:0}
.oblab{display:block;font-size:13px;font-weight:800;color:var(--mut);margin:18px 0 8px;text-align:center;letter-spacing:.04em;text-transform:uppercase}
@keyframes obin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes obpop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
