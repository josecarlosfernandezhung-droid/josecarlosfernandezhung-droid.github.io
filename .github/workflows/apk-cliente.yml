name: APK del catalogo para clientes
on:
  workflow_dispatch:
  push:
    paths:
      - 'apk-cliente/**'
      - '.github/workflows/apk-cliente.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk-cliente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick || true
          npm install
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true
      - name: Icono y firma
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p android/app/src/main/res/mipmap-$n
            convert icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png || true
            cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png || true
            cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_foreground.png || true
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          mkdir -p ~/.android
          gh release download llave-apk -p debug.keystore -D . 2>/dev/null || true
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            gh release create llave-apk debug.keystore --title "Llave de firma" --notes "Llave para que cada version de la app se instale sobre la anterior" --prerelease --latest=false || true
          fi
          cp -f debug.keystore ~/.android/debug.keystore
          cp -f debug.keystore android/app/debug.keystore
          if [ -f android/app/build.gradle ] && ! grep -q signingConfigs android/app/build.gradle; then
            sed -i 's/buildTypes {/signingConfigs {\n        debug {\n            storeFile file('\''debug.keystore'\'')\n            storePassword '\''android'\''\n            keyAlias '\''androiddebugkey'\''\n            keyPassword '\''android'\''\n        }\n    }\n    buildTypes {/' android/app/build.gradle
          fi
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Compilar
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ../catalogo.apk
          gh release create "apk-${{ github.run_number }}" ../catalogo.apk --title "Catalogo ${{ github.run_number }}" --notes "APK del catalogo para clientes" --latest
